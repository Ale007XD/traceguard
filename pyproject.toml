[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nano-vm-traceguard"
version = "0.1.0"
description = "Execution observability for autonomous agent runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
traceguard = "traceguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["traceguard"]
